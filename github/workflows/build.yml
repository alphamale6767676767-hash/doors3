name: Build 3DS CIA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm   # devkitPro toolchain, runs in GitHub's cloud
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git build-essential cmake zip pkg-config
          dkp-pacman -Sy --noconfirm 3ds-dev || true

      - name: Build makerom
        run: |
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git
          cd Project_CTR/makerom
          (make deps -j"$(nproc)" || true)
          make -j"$(nproc)"
          cp "$(find . -name makerom -type f | head -1)" /usr/local/bin/makerom

      - name: Build bannertool
        run: |
          git clone --depth 1 --recursive https://github.com/carstene1ns/3ds-bannertool.git
          cd 3ds-bannertool
          cmake -B build
          cmake --build build -j"$(nproc)"
          cp "$(find build -name bannertool -type f | head -1)" /usr/local/bin/bannertool

      - name: Build game
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$PATH:$DEVKITPRO/tools/bin:$DEVKITARM/bin
          make

      - uses: actions/upload-artifact@v4
        with:
          name: hallway100-3ds
          path: |
            *.cia
            *.3dsx
